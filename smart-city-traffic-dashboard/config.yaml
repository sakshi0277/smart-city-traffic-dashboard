# Central settings. Change values here instead of editing code.

project:
  title: "Smart City Traffic & Route Intelligence Dashboard"
  subtitle: "Varanasi, Uttar Pradesh, India"
  version: "0.1.0"

city:
  name: "Varanasi"
  place_query: "Varanasi, Uttar Pradesh, India"   # used by OSMnx in Phase 2
  center_lat: 25.3176
  center_lon: 82.9739
  default_zoom: 12
  timezone: "Asia/Kolkata"

weather:
  provider: "Open-Meteo"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  archive_url: "https://archive-api.open-meteo.com/v1/archive"
  request_timeout_seconds: 15

paths:
  raw: "data/raw"
  processed: "data/processed"
  simulated: "data/simulated"
  demo: "data/demo"
  models: "models"
  reports: "reports"

# Data provenance labels used everywhere in the dashboard.
provenance:
  REAL:      { emoji: "🟢", color: "#2e7d32", meaning: "Downloaded from a genuine open source" }
  SIMULATED: { emoji: "🟡", color: "#f9a825", meaning: "Generated by our code from stated assumptions" }
  DEMO:      { emoji: "🔵", color: "#1565c0", meaning: "Hand-made sample records to show a feature" }
  USER:      { emoji: "🟣", color: "#6a1b9a", meaning: "Submitted by a person through this dashboard" }
